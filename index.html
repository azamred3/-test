<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#14111B">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="عودة للعقار — بيتك يبدأ من هنا. عقارات مختارة بعناية.">
    <title>عودة للعقار — بيتك يبدأ من هنا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- أيقونات Phosphor -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
    <!-- Swiper + Leaflet -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شاشة الافتتاح -->
<div class="splash" id="splash" aria-hidden="true">
    <div class="splash-logo">
        <svg viewBox="0 0 48 48" fill="none"><defs><linearGradient id="lgS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><path class="sp-house" d="M6 23.5 24 7l18 16.5V39a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="url(#lgS)"/><path class="sp-door" d="M18 42V28a6 6 0 0 1 12 0v14z" fill="#FFC56B"/></svg>
    </div>
    <div class="splash-name">عودة<span>للعقار</span></div>
    <div class="splash-bar"><i></i></div>
</div>

<!-- الترويسة -->
<header class="app-header" id="app-header">
    <div class="header-row">
        <div class="brand" id="home-logo-btn" role="button" tabindex="0" aria-label="الرئيسية">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48" fill="none"><defs><linearGradient id="lgH" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60A5FA"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><path d="M6 23.5 24 7l18 16.5V39a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="url(#lgH)"/><path d="M18 42V28a6 6 0 0 1 12 0v14z" fill="#FFC56B"/></svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">عودة</span>
                <span class="brand-sub">للعقار</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="favorites-btn" aria-label="المفضلة">
                <i class="ph ph-heart"></i>
                <span class="notif-badge" id="fav-count" hidden>0</span>
            </button>
            <a class="icon-btn" href="log.html" aria-label="حسابي"><i class="ph ph-user-circle"></i></a>
        </div>
    </div>
</header>

<main class="page">

    <!-- قسم الترحيب والبحث -->
    <section class="hero" id="hero">
        <p class="hero-hello"><span id="hero-greeting">أهلاً</span> <b id="welcome-name">بك</b> <span class="wave">👋</span></p>
        <h1 class="hero-title">ابحث عن <em>بيتك القادم</em><br>بكل سهولة</h1>

        <div class="search-wrap">
            <div class="search-bar">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="search" class="search-input" id="search-input"
                       placeholder="ابحث عن عقار، منطقة، رمز..." autocomplete="off" enterkeyhint="search">
                <button class="search-clear-btn" id="search-clear" aria-label="مسح"><i class="ph-bold ph-x"></i></button>
                <button class="search-filter-btn" id="filter-toggle-btn" aria-label="فلترة">
                    <i class="ph ph-sliders-horizontal"></i>
                    <span class="active-filters-count" id="active-filters-count" hidden>0</span>
                </button>
            </div>
            <div class="search-suggestions" id="search-suggestions"></div>
        </div>

        <div class="hero-stats" id="hero-stats"></div>
    </section>

    <!-- التصنيفات -->
    <div class="cats-bar" id="cats-bar">
        <div class="cats-scroll" id="filter-chips"></div>
    </div>

    <!-- مميزة -->
    <section class="featured" id="featured-section" hidden>
        <div class="section-head">
            <h2><i class="ph-fill ph-sparkle"></i> وصل حديثاً</h2>
        </div>
        <div class="swiper feat-swiper" id="feat-swiper">
            <div class="swiper-wrapper" id="feat-wrapper"></div>
        </div>
    </section>

    <!-- شريط النتائج -->
    <div class="results-toolbar" id="results-toolbar">
        <div class="results-info">
            <h2 class="section-title">كل العقارات</h2>
            <span class="results-count" id="results-count">0 عقار</span>
        </div>
        <div class="toolbar-actions">
            <div class="sort-dropdown">
                <button class="toolbar-btn" id="sort-btn">
                    <i class="ph ph-arrows-down-up"></i>
                    <span id="sort-label">الأحدث</span>
                </button>
                <div class="sort-menu" id="sort-menu">
                    <button data-sort="newest" class="active">الأحدث</button>
                    <button data-sort="price-asc">السعر: الأقل أولاً</button>
                    <button data-sort="price-desc">السعر: الأعلى أولاً</button>
                    <button data-sort="area-asc">المساحة: الأصغر</button>
                    <button data-sort="area-desc">المساحة: الأكبر</button>
                </div>
            </div>
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" aria-label="عرض الشبكة"><i class="ph ph-squares-four"></i></button>
                <button class="view-btn" data-view="map" aria-label="عرض الخريطة"><i class="ph ph-map-trifold"></i></button>
            </div>
        </div>
    </div>

    <div class="properties-container" id="properties-container"></div>
    <div id="properties-map" class="properties-map" style="display:none"></div>
</main>

<!-- شريط المقارنة العائم -->
<div class="compare-bar" id="compare-bar" hidden>
    <div class="compare-thumbs" id="compare-thumbs"></div>
    <span class="compare-label">اختر حتى 3 للمقارنة</span>
    <button class="btn btn-primary btn-sm" id="compare-open-btn"><i class="ph ph-scales"></i> قارن</button>
    <button class="btn-icon-sm" id="compare-clear-btn" aria-label="مسح"><i class="ph-bold ph-x"></i></button>
</div>

<!-- شريط التنقل السفلي -->
<nav class="bottom-nav" id="bottom-nav" aria-label="التنقل">
    <button class="nav-item active" data-nav="home"><i class="ph-fill ph-house-line"></i><span>الرئيسية</span></button>
    <button class="nav-item" data-nav="map"><i class="ph ph-map-pin-area"></i><span>الخريطة</span></button>
    <button class="nav-item" data-nav="fav"><i class="ph ph-heart"></i><span>المفضلة</span></button>
    <a class="nav-item" href="log.html"><i class="ph ph-user-circle"></i><span>حسابي</span></a>
</nav>

<!-- الخلفية المشتركة للأوراق -->
<div class="backdrop" id="backdrop"></div>

<!-- ورقة الفلاتر -->
<div class="sheet" id="filter-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <h3>فلترة العقارات</h3>
        <button class="close-btn" id="filter-sheet-close" aria-label="إغلاق"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="sheet-body">
        <div class="filter-group">
            <label>التصنيف</label>
            <div class="chips-grid" id="filter-categories"></div>
        </div>
        <div class="filter-group">
            <label>نوع العملية</label>
            <div class="chips-grid" id="filter-transactions">
                <button class="chip-option" data-val="للبيع"><i class="ph ph-tag"></i> للبيع</button>
                <button class="chip-option" data-val="للإيجار"><i class="ph ph-key"></i> للإيجار</button>
            </div>
        </div>
        <div class="filter-group">
            <label>نطاق السعر (ر.س)</label>
            <div class="range-row">
                <input type="number" id="filter-min-price" placeholder="من" inputmode="numeric">
                <input type="number" id="filter-max-price" placeholder="إلى" inputmode="numeric">
            </div>
        </div>
        <div class="filter-group">
            <label>نطاق المساحة (م²)</label>
            <div class="range-row">
                <input type="number" id="filter-min-area" placeholder="من" inputmode="numeric">
                <input type="number" id="filter-max-area" placeholder="إلى" inputmode="numeric">
            </div>
        </div>
    </div>
    <div class="sheet-footer">
        <button class="btn btn-outline" id="filter-reset-btn">إعادة تعيين</button>
        <button class="btn btn-primary" id="filter-apply-btn"><i class="ph-bold ph-check"></i> تطبيق</button>
    </div>
</div>

<!-- ورقة المفضلة -->
<div class="sheet" id="favorites-drawer">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <h3><i class="ph-fill ph-heart" style="color:var(--fav)"></i> المفضلة</h3>
        <button class="close-btn" id="favorites-close" aria-label="إغلاق"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="sheet-body" id="favorites-body"></div>
</div>

<!-- ورقة المقارنة -->
<div class="sheet sheet-tall" id="compare-modal">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <h3><i class="ph ph-scales" style="color:var(--accent-bright)"></i> مقارنة العقارات</h3>
        <button class="close-btn" id="compare-close" aria-label="إغلاق"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="compare-grid" id="compare-grid"></div>
</div>

<!-- ورقة الاستفسار -->
<div class="sheet sheet-top" id="inquiry-modal">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <h3><i class="ph-fill ph-paper-plane-tilt" style="color:var(--accent-bright)"></i> تواصل معنا</h3>
        <button class="close-btn" id="inquiry-close" aria-label="إغلاق"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="sheet-body">
        <p class="inquiry-property-title" id="inquiry-property-title"></p>
        <div class="form-group">
            <label for="inquiry-name">الاسم *</label>
            <input type="text" id="inquiry-name" placeholder="اسمك الكريم" maxlength="50" autocomplete="name">
        </div>
        <div class="form-group">
            <label for="inquiry-phone">الجوال *</label>
            <input type="tel" id="inquiry-phone" placeholder="05xxxxxxxx" dir="ltr" maxlength="15" inputmode="tel" autocomplete="tel">
        </div>
        <div class="form-group">
            <label for="inquiry-message">رسالتك (اختياري)</label>
            <textarea id="inquiry-message" rows="3" placeholder="أنا مهتم بهذا العقار..."></textarea>
        </div>
    </div>
    <div class="sheet-footer">
        <button class="btn btn-outline" id="inquiry-cancel">إلغاء</button>
        <button class="btn btn-wa" id="inquiry-submit"><i class="ph-fill ph-whatsapp-logo"></i> إرسال عبر واتساب</button>
    </div>
</div>

<!-- ورقة المشاركة -->
<div class="sheet sheet-top" id="share-modal">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
        <h3>مشاركة العقار</h3>
        <button class="close-btn" id="share-close" aria-label="إغلاق"><i class="ph-bold ph-x"></i></button>
    </div>
    <div class="share-options">
        <button class="share-option whatsapp-share" data-type="whatsapp"><i class="ph-fill ph-whatsapp-logo"></i><span>واتساب</span></button>
        <button class="share-option telegram-share" data-type="telegram"><i class="ph-fill ph-telegram-logo"></i><span>تيليجرام</span></button>
        <button class="share-option link-share" data-type="link"><i class="ph ph-link-simple"></i><span>نسخ الرابط</span></button>
    </div>
</div>

<!-- صفحة تفاصيل العقار -->
<div class="preview-overlay" id="preview-overlay">
    <div class="preview">
        <div class="preview-topbar">
            <button class="round-btn" id="preview-close" aria-label="رجوع"><i class="ph-bold ph-arrow-right"></i></button>
            <div class="preview-topbar-actions">
                <button class="round-btn" id="preview-compare-btn" aria-label="مقارنة"><i class="ph ph-scales"></i></button>
                <button class="round-btn" id="preview-share-btn" aria-label="مشاركة"><i class="ph ph-share-network"></i></button>
                <button class="round-btn" id="preview-favorite-btn" aria-label="المفضلة"><i class="ph ph-heart"></i></button>
            </div>
        </div>
        <div class="preview-content"></div>
        <div class="preview-contact" id="preview-contact"></div>
    </div>
</div>

<div class="app-toast" id="app-toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="script.js"></script>

</body>
</html>
