<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14111B">
<title>عودة للعقار — تسجيل الدخول</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="log.css">
</head>
<body>

<!-- ============ شاشة الافتتاح ============ -->
<div class="loader" id="loader" aria-hidden="true">
    <svg class="loader-house" viewBox="0 0 48 48" fill="none">
        <path class="lh-body" pathLength="1" d="M7 22 24 7l17 15v18a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/>
        <path class="lh-door" pathLength="1" d="M19 42V29h10v13"/>
        <circle class="lh-light" cx="24" cy="22" r="3.2"/>
    </svg>
    <div class="loader-name">عودة للعقار</div>
</div>

<main class="auth" id="auth">

    <!-- ============ المشهد: مدينة تضيء نوافذها ============ -->
    <section class="scene">
        <svg id="skyline" viewBox="0 0 1000 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
            <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#100D18"/>
                    <stop offset=".45" stop-color="#1D1634"/>
                    <stop offset=".8" stop-color="#3A2650"/>
                    <stop offset="1" stop-color="#6A3B5C"/>
                </linearGradient>
                <radialGradient id="moonGlow">
                    <stop offset="0" stop-color="#F6E9C9" stop-opacity=".35"/>
                    <stop offset="1" stop-color="#F6E9C9" stop-opacity="0"/>
                </radialGradient>
                <radialGradient id="houseGlow">
                    <stop offset="0" stop-color="#FFC56B" stop-opacity=".55"/>
                    <stop offset="1" stop-color="#FFC56B" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#150F22"/>
                    <stop offset="1" stop-color="#0E0A17"/>
                </linearGradient>
            </defs>

            <rect width="1000" height="800" fill="url(#sky)"/>
            <g id="stars"></g>
            <g id="moon">
                <circle cx="190" cy="150" r="140" fill="url(#moonGlow)"/>
                <circle cx="190" cy="150" r="30" fill="#F4EBD3"/>
                <circle cx="201" cy="143" r="26" fill="#1D1634" opacity=".16"/>
            </g>

            <g id="layer-far"></g>
            <g id="layer-mid"></g>
            <g id="layer-near"></g>

            <rect x="-100" y="752" width="1200" height="60" fill="url(#ground)"/>

            <!-- البيت الذي ينتظرك -->
            <g id="home" transform="translate(500 752)">
                <circle class="home-glow" cx="0" cy="-26" r="90" fill="url(#houseGlow)"/>
                <path d="M-38 -34 0 -66 38 -34V0H-38z" fill="#0F0A19"/>
                <rect class="home-window" x="-22" y="-30" width="14" height="15" rx="2"/>
                <rect class="home-window" x="8" y="-30" width="14" height="15" rx="2"/>
                <rect class="home-door" x="-6" y="-20" width="12" height="20" rx="2"/>
            </g>
        </svg>

        <div class="scene-copy">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48" fill="none"><path d="M7 22 24 7l17 15v18a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z" fill="currentColor"/><circle cx="24" cy="24" r="4" fill="#FFC56B"/></svg>
                </span>
                <span class="brand-name">عودة للعقار</span>
            </div>

            <div class="hero">
                <h1>بيتك ينتظرك.</h1>
                <p>سجّل دخولك لتتابع عقاراتك المفضلة وتقارن بينها من أي جهاز.</p>
            </div>
        </div>
    </section>

    <!-- ============ النموذج ============ -->
    <section class="panel">
        <div class="panel-inner">

            <div class="tabs" id="tabs" data-active="login" role="tablist">
                <span class="tab-pill" aria-hidden="true"></span>
                <button type="button" class="tab active" role="tab" data-tab="login" aria-selected="true">تسجيل الدخول</button>
                <button type="button" class="tab" role="tab" data-tab="signup" aria-selected="false">حساب جديد</button>
            </div>

            <!-- دخول -->
            <form class="form active" id="login-form" novalidate>
                <header class="form-head">
                    <h2>أهلاً بعودتك</h2>
                    <p>أدخل بياناتك للمتابعة إلى حسابك.</p>
                </header>

                <div class="field" style="--n:1">
                    <input id="login-email" type="email" dir="ltr" placeholder=" " autocomplete="email" inputmode="email" required>
                    <label for="login-email">البريد الإلكتروني</label>
                    <p class="err" aria-live="polite"></p>
                </div>

                <div class="field has-eye" style="--n:2">
                    <input id="login-password" type="password" dir="ltr" placeholder=" " autocomplete="current-password" required>
                    <label for="login-password">كلمة المرور</label>
                    <button type="button" class="eye" aria-label="إظهار كلمة المرور">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                    <p class="err" aria-live="polite"></p>
                </div>

                <div class="row" style="--n:3">
                    <button type="button" class="link" id="forgot">نسيت كلمة المرور؟</button>
                </div>

                <button type="submit" class="submit" data-state="idle" style="--n:4">
                    <span class="btn-label">تسجيل الدخول</span>
                    <span class="btn-spin" aria-hidden="true"></span>
                    <svg class="btn-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </button>

                <p class="switch" style="--n:5">ليس لديك حساب؟ <button type="button" class="link" data-go="signup">أنشئ حساباً</button></p>
            </form>

            <!-- حساب جديد -->
            <form class="form" id="signup-form" novalidate>
                <header class="form-head">
                    <h2>أنشئ حسابك</h2>
                    <p>يستغرق ذلك أقل من دقيقة.</p>
                </header>

                <div class="field" style="--n:1">
                    <input id="su-name" type="text" placeholder=" " autocomplete="name" required>
                    <label for="su-name">الاسم الكامل</label>
                    <p class="err" aria-live="polite"></p>
                </div>

                <div class="field" style="--n:2">
                    <input id="su-email" type="email" dir="ltr" placeholder=" " autocomplete="email" inputmode="email" required>
                    <label for="su-email">البريد الإلكتروني</label>
                    <p class="err" aria-live="polite"></p>
                </div>

                <div class="field" style="--n:3">
                    <input id="su-phone" type="tel" dir="ltr" placeholder=" " autocomplete="tel" inputmode="tel" required>
                    <label for="su-phone">رقم الجوال</label>
                    <p class="err" aria-live="polite"></p>
                </div>

                <div class="field has-eye" style="--n:4">
                    <input id="su-pass" type="password" dir="ltr" placeholder=" " autocomplete="new-password" required>
                    <label for="su-pass">كلمة المرور</label>
                    <button type="button" class="eye" aria-label="إظهار كلمة المرور">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                    <p class="err" aria-live="polite"></p>
                </div>

                <div class="meter" id="meter" data-level="0" style="--n:5">
                    <div class="meter-bars"><i></i><i></i><i></i><i></i></div>
                    <span class="meter-text" id="meter-text">استخدم 8 أحرف أو أكثر</span>
                </div>

                <div class="field has-eye" style="--n:6">
                    <input id="su-pass2" type="password" dir="ltr" placeholder=" " autocomplete="new-password" required>
                    <label for="su-pass2">تأكيد كلمة المرور</label>
                    <button type="button" class="eye" aria-label="إظهار كلمة المرور">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg class="eye-shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.5 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                    </button>
                    <p class="err" aria-live="polite"></p>
                </div>

                <label class="check" style="--n:7">
                    <input type="checkbox" id="su-terms">
                    <span class="check-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
                    <span>أوافق على الشروط والأحكام</span>
                </label>

                <button type="submit" class="submit" data-state="idle" style="--n:8">
                    <span class="btn-label">إنشاء الحساب</span>
                    <span class="btn-spin" aria-hidden="true"></span>
                    <svg class="btn-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </button>

                <p class="switch" style="--n:9">لديك حساب بالفعل؟ <button type="button" class="link" data-go="login">سجّل دخولك</button></p>
            </form>

        </div>
    </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-dot"></span>
    <span id="toast-text"></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="log.js"></script>
</body>
</html>
